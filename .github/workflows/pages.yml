# 공개 재생 페이지를 짓고 GitHub Pages 로 올린다.
#
# 사이트는 손으로 배포하지 않는다. main 에 들어간 것만 공개된다.
# PR 에서는 테스트와 데이터 최신 여부만 확인하고 배포하지 않는다 —
# 아직 리뷰받지 않은 명령이 공개 페이지에 실리면 안 된다.
name: 재생 페이지

on:
  push:
    branches: [main]
    paths: ["site/**", "drone/**", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["site/**", "drone/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

# 배포는 한 번에 하나만. 진행 중인 것을 끊지는 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # 잡 ID 는 ASCII 여야 한다. 화면에 보이는 이름만 한글로 둔다.
  verify:
    name: 검증
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 비행 로직 테스트. 표준 라이브러리만 쓰므로 설치할 게 없다.
      - name: 단위 테스트
        run: python3 -m unittest discover -s drone/tests -t . -v

      # 페이지에 실린 비행 데이터가 지금 코드가 만들어내는 것과 같은지 본다.
      # orders.txt 만 고치고 build.py 를 안 돌린 PR 은 여기서 걸린다.
      - name: 재생 데이터 최신 여부
        run: python3 site/build.py --check

      - name: 사이트 묶기
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: 배포
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
