# 공개 재생 페이지를 짓고 GitHub Pages 로 올린다.
#
# 사이트는 손으로 배포하지 않는다. main 에 들어간 것만 공개된다.
# PR 에서는 테스트와 데이터 최신 여부만 확인하고 배포하지 않는다 —
# 아직 리뷰받지 않은 명령이 공개 페이지에 실리면 안 된다.
#
# 저장소 설정도 손으로 건드릴 필요 없다. 배포 잡의 configure-pages 가
# Pages 사이트가 없으면 만든다. 설정 화면을 찾아 헤매는 단계 하나가
# 통째로 사라진다.
name: 재생 페이지

on:
  push:
    branches: [main]
    paths: ["site/**", "drone/**", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["site/**", "drone/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

# 배포는 한 번에 하나만. 진행 중인 것을 끊지는 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # 잡 ID 는 ASCII 여야 한다. 화면에 보이는 이름만 한글로 둔다.
  verify:
    name: 검증
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 비행 경로 자체는 표준 라이브러리만 쓰지만, OAK-D 뎁스 처리 테스트는
      # numpy 가 있어야 돈다. 없으면 그 모듈이 조용히 건너뛰어지고, 실기체의
      # 유일한 전방 감지 수단이 검사되지 않은 채로 배포된다.
      - name: numpy 설치 (뎁스 테스트용)
        run: python3 -m pip install --quiet "numpy>=1.26"

      - name: 단위 테스트
        run: python3 -m unittest discover -s drone/tests -t . -v

      # 페이지 헤더에 적힌 테스트 개수가 실제와 같은지 본다. 사람이 손으로
      # 적는 숫자는 반드시 낡는다 — 낡으면 조용히 틀린 채로 공개된다.
      - name: 페이지의 테스트 개수
        run: |
          set -euo pipefail
          actual=$(python3 -m unittest discover -s drone/tests -t . 2>&1 \
                   | grep -oP 'Ran \K[0-9]+')
          shown=$(grep -oP 'id="f-tests">\K[0-9]+' site/index.html)
          echo "실제 $actual · 페이지 $shown"
          test "$actual" = "$shown"

      # 페이지에 실린 비행 데이터가 지금 코드가 만들어내는 것과 같은지 본다.
      # orders.txt 만 고치고 build.py 를 안 돌린 PR 은 여기서 걸린다.
      - name: 재생 데이터 최신 여부
        run: python3 site/build.py --check

      - name: 사이트 묶기
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: 배포
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # 저장소 설정에서 Pages 를 손으로 켜지 않아도 되게 한다. 이 잡은
      # pages:write 를 갖고 있으므로, 아직 Pages 사이트가 없으면 여기서
      # 만든다. 이미 켜져 있으면 아무것도 하지 않는다.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - id: deploy
        uses: actions/deploy-pages@v4
